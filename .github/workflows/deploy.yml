name: Deploy Serverless Application

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::292960609315:role/GitHubActions-ServerlessNotification
          aws-region: ap-south-1

      - name: Package Lambda
        run: |
          cd lambda
          zip ../sendEmail.zip sendEmail.py

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name sendEmail \
            --zip-file fileb://sendEmail.zip

      - name: Deploy Step Functions
        run: |
          aws stepfunctions update-state-machine \
            --state-machine-arn arn:aws:states:ap-south-1:292960609315:stateMachine:ServerlessNotificationWorkflow \
            --definition file://step-functions/state-machine.json