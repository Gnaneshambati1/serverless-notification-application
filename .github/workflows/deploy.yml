name: Deploy Serverless Application

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r lambda/requirements-dev.txt
          pip install flake8

      - name: Lint
        run: flake8 lambda/ --max-line-length=100

      - name: Run tests
        env:
          SENDER_EMAIL: test@example.com
        run: |
          cd lambda
          python -m pytest

  deploy:
    name: Deploy to AWS
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActions-ServerlessNotification
          aws-region: ap-south-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name serverless-notification-app \
            --parameter-overrides SenderEmail=${{ secrets.SES_SENDER_EMAIL }} \
            --capabilities CAPABILITY_IAM
