name: Deploy Serverless Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActions-ServerlessNotification
          aws-region: ap-south-1

      # --- everything below this line replaces the old
      # "Package Lambda" / "Deploy Lambda" / "Deploy Step Functions" steps ---

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name serverless-notification-app \
            --parameter-overrides SenderEmail=${{ secrets.SES_SENDER_EMAIL }} \
            --capabilities CAPABILITY_IAM
